<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Signup - Friends Trip Manager</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/common.js"></script>
<script src="js/i18n.js"></script>
</head>
<body>
<div class="wrap">
<div class="card">
<h1 data-i18n="app_title">Friends Trip Manager</h1>
<p class="muted" data-i18n="login_desc">লগইন করুন অথবা নতুন অ্যাকাউন্ট খুলুন। সাইনআপের পর Manager / Member বেছে নিতে হবে।</p>
<label for="email" data-i18n="email_label">ইমেইল</label>
<input id="email" type="email" placeholder="you@example.com" autocomplete="email">
<label for="password" data-i18n="password_label">পাসওয়ার্ড</label>
<input id="password" type="password" placeholder="Minimum 6 characters / কমপক্ষে ৬ অক্ষর" autocomplete="current-password">
<div class="row">
<button id="loginBtn" data-i18n="login_btn">লগইন</button>
<button id="signupBtn" class="secondary" data-i18n="signup_btn">সাইনআপ</button>
</div>
<div id="msg"></div>
</div>
</div>
<script src="js/auth.js"></script>
</body>
</html>
